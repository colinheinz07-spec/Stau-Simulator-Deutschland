name: Interaktive A3/A48 Deutschlandkarte veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-map
  cancel-in-progress: true
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4
      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: OSM-Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
      - name: Architekturtests und Browsermodule prüfen
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check web/app.js
          node --check web/network-loader.js
          node --check web/bootstrap.js
          node --check web/legacy-canvas.js
          node --check web/legacy-geometry.js
          node --check web/traffic-reference.js
          node --check web/offline-traffic.js
          node --check web/event-schedule.js
          node --check web/offline-event-editor.js
      - name: Echte A3/A48 vollständig aus Rheinland-Pfalz, NRW und Hessen aufbauen
        id: osm_build
        continue-on-error: true
        run: |
          bash scripts/build-a3-a48-map.sh /tmp/map-build
      - name: Gerichtete Rampen und Anschlussstellen auf echte Verbindungen prüfen
        id: osm_audit
        if: steps.osm_build.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/audit-a3-a48-connectivity.mjs \
            /tmp/map-build/selected-network.json /tmp/map-build/connectivity-audit.json
      - name: OSM-Prüfbericht auch bei fehlgeschlagenem Streckenimport sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-a48-netzimport-diagnose
          path: |
            /tmp/map-build/corridor-source.json.failed-audit.json
            /tmp/map-build/corridor-source.json.audit.json
            /tmp/map-build/selected-network.json.audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Karte und echte Daten als statische Webseite zusammenstellen
        run: |
          mkdir -p _site/data
          cp web/index.html web/styles.css web/app.js web/network-loader.js web/simulation-controller.js web/bootstrap.js web/legacy-canvas.js web/legacy-geometry.js web/traffic-reference.js web/offline-traffic.js web/event-schedule.js web/offline-event-editor.js _site/
          cp -R dist _site/dist
          touch _site/.nojekyll
          if [[ "${{ steps.osm_build.outcome }}" == "success" && "${{ steps.osm_audit.outcome }}" == "success" ]]; then
            cp -R /tmp/map-build/tiles _site/data/tiles
            cp /tmp/map-build/selected-network.json.audit.json _site/data/corridor-audit.json
            cp /tmp/map-build/connectivity-audit.json _site/data/connectivity-audit.json
            cp /tmp/map-build/corridor-source.json.audit.json _site/data/import-audit.json
            echo '{"mode":"full-osm-import"}' > _site/data/build-status.json
            python3 - <<'PY'
          import json,pathlib
          site=pathlib.Path('_site')
          manifest=json.loads((site/'data/tiles/manifest.json').read_text())
          audit=json.loads((site/'data/corridor-audit.json').read_text())
          assert manifest['counts']['uniqueEdges']>100
          assert manifest['counts']['tiles']>2
          assert audit['mainlineEdges']>100
          assert audit['rampEdges']>20
          print('A3/A48-Karte: Hauptfahrbahnsegmente=',audit['mainlineEdges'],
                'Rampen=',audit['rampEdges'],'Tiles=',manifest['counts']['tiles'])
          if audit['importIssues']:
              print('HINWEIS: Teilschnitt enthält noch OSM-Importwarnungen:',
                    audit['importIssues'][:10])
          assert (site/'dist/06_Karte.js').is_file()
          assert (site/'dist/03_Stauphysik/netzfluss.js').is_file()
          assert (site/'simulation-controller.js').is_file()
          connectivity=json.loads((site/'data/connectivity-audit.json').read_text())
          assert connectivity['counts']['invalidTurns']==0
          print('Knotenprüfung:',connectivity['counts'])
          for tile in manifest['tiles']:
              assert (site/'data/tiles'/tile['file']).stat().st_size>0
          print('Karte bereit:',manifest['counts'])
          PY
            echo "Vollständige OSM-Karte aufgebaut und geprüft." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Externer OSM-Import nicht bereit; stattdessen lokales Canvas-Verkehrsmodell veröffentlicht."
            echo '{"mode":"local-canvas-fallback","reason":"OSM-Import oder Topologieaudit derzeit nicht erfolgreich"}' > _site/data/build-status.json
            {
              echo "## Eingeschränkte Karte (Offline-Fallback)"
              echo "Die aktuellen Verbesserungen am lokalen OSM-Canvas-Verkehrsmodell werden bereitgestellt."
              echo "Der vollständige A3/A48-Import war nicht verfügbar oder bestand das Topologieaudit nicht."
              echo "**Dies ist ausdrücklich kein vollständiger importierter Netzstand.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Komplette Karten-Vorschau zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: stau-simulator-deutschland-web-vorschau
          path: _site/
          retention-days: 30
          if-no-files-found: error
      - name: GitHub Pages konfigurieren
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Kartenseite bereitstellen
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Karte veröffentlichen
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: GitHub Pages Aktivierung erklären
        if: steps.pages_setup.outcome != 'success'
        run: |
          {
            echo "## Die Karten-Vorschau ist erfolgreich gebaut"
            echo "Die ZIP-Datei **stau-simulator-deutschland-web-vorschau** findest du unter Artifacts."
            echo
            echo "Die öffentliche Seite braucht noch GitHub Pages: Repository > Settings > Pages >"
            echo "**Build and deployment > Source: GitHub Actions**."
            echo "Danach den Workflow **Interaktive Deutschlandkarte veröffentlichen**"
            echo "unter Actions mit **Run workflow** starten."
          } >> "$GITHUB_STEP_SUMMARY"
