name: Experimenteller Real-OSM-Netzimport
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/real-osm-import-smoke.yml'
jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Live PBF smoke test: exact clipping boundary and shared source nodes (v4).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Osmium für echte PBF-Quelldaten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
      - name: Abhängigkeiten installieren und neue App bauen
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Kleinen echten Deutschland-OSM-Datensatz herunterladen
        run: |
          curl -fLsS --retry 3 --max-time 240 \
            -o /tmp/bremen-latest.osm.pbf \
            https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf
          test -s /tmp/bremen-latest.osm.pbf
          curl -fLsS --retry 3 --max-time 60 \
            -o /tmp/bremen.poly \
            https://download.geofabrik.de/europe/germany/bremen.poly
          test -s /tmp/bremen.poly
      - name: Allgemeinen bundesweiten Import und Kachelbau mit echtem PBF prüfen
        run: bash scripts/build-germany-network.sh /tmp/bremen-latest.osm.pbf /tmp/real-osm-smoke --boundary-poly=/tmp/bremen.poly
      - name: Gefundene Netzprobleme oder übernommene Ref-Nummern zusammenfassen
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          for name in ('generated-network.json.failed-audit.json',
                       'generated-network.json.audit.json'):
              path=pathlib.Path('/tmp/real-osm-smoke')/name
              if not path.exists():
                  continue
              report=json.loads(path.read_text())
              print('AUDIT DATEI:', name)
              print('Hauptfahrbahnen:', report.get('importedMotorwayWays'))
              print('Rampen:', report.get('importedRampWays'))
              print('Servicezugänge bewusst ausgeschlossen:',sum('Betriebs' in x.get('reason','') for x in report.get('excludedWays',[])))
              print('Via-Way-Abbiegeverbote:',report.get('compiledViaWayRestrictions'))
              print('Aufgeschobene Via-Way-Relationen:',report.get('deferredViaWayRelations'))
              print('Hauptfahrbahnen ohne A-Nummer:', report.get('unassignedMotorwayWays'))
              print('Eindeutig geerbte OSM-Nummern:',len(report.get('inferredMotorwayRefs',[])))
              for inherited in report.get('inferredMotorwayRefs',[])[:15]:
                  print('  geerbt:', inherited)
              print('Bestätigte Extraktgrenzen:', report.get('extractBoundaryRampEnds'))
              print('Belegte gemeinsame Quellknoten:', report.get('sourceStartRampEnds'))
              print('Ungeloeste Rampenenden:',len(report.get('unconnectedRampEnds',[])))
              for ramp in report.get('unconnectedRampEnds',[])[:20]:
                  print('  rampenende:', ramp)
              print('Fehler insgesamt:',len(report.get('issues',[])))
              for issue in report.get('issues',[])[:40]:
                  print('  -',issue)
          PY
      - name: OSM-Audit und Kachelmanifest dokumentieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-osm-germany-smoke-audit
          if-no-files-found: warn
          path: |
            /tmp/real-osm-smoke/generated-network.json.audit.json
            /tmp/real-osm-smoke/generated-network.json.failed-audit.json
            /tmp/real-osm-smoke/tiles/manifest.json
            /tmp/real-osm-smoke/source-metadata.json
          retention-days: 7
